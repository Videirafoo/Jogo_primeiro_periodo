name: OS Eternos V3 Godot

on:
  push:
    branches:
      - "v3-godot-main"
      - "v3-*"
  pull_request:
    branches:
      - "main"
      - "v3-godot-main"
  workflow_dispatch:

jobs:
  godot-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -L             -o /tmp/godot.zip             "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          /tmp/godot/godot --version

      - name: Import V3 project
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/godot             --headless             --editor             --path v3_godot             --quit

      - name: V3 boot smoke
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/godot             --headless             --path v3_godot             --quit-after 8

      - name: V3 regression suite
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            urgent_regression.gd
            story_flow.gd
            accessibility_safety.gd
            world_integrity.gd
            interaction_safety.gd
            interior_door_integrity.gd
            scale_integrity.gd
            equipment_integrity.gd
            forge_quest_integrity.gd
            enemy_grounding.gd
            encounter_integrity.gd
          )
          for test_file in "${tests[@]}"; do
            echo "==> $test_file"
            /tmp/godot/godot               --headless               --path v3_godot               -s "res://tests/$test_file"
          done
