name: Windows V2 Beta

on:
  workflow_dispatch:
  push:
    branches:
      - "v2.8.1-beta2"
    tags:
      - "v2-beta-*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate V2.8 authored music
        run: python music_v28.py

      - name: Run tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m unittest -q

      - name: Native Windows visual smoke
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python eternos.py --smoke

      - name: Build EXE
        run: pyinstaller --noconfirm OsEternos.spec

      - name: Upload Windows Beta
        uses: actions/upload-artifact@v4
        with:
          name: OsEternosV2-Windows
          path: dist/OsEternosV2.exe
